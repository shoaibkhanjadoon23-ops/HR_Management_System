<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apply for Job - HRPro</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* ── Success screen ──────────────────────────────────────── */
.success-hero {
  background: linear-gradient(135deg, #ecfdf5, #d1fae5);
  border: 2px solid #10b981;
  border-radius: 16px;
  padding: 40px 28px 32px;
  text-align: center;
  margin-bottom: 20px;
  animation: fadeInUp .5s ease;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}
.success-icon {
  width: 80px; height: 80px;
  background: #10b981; color: white;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 42px;
  margin: 0 auto 20px;
  box-shadow: 0 8px 24px rgba(16,185,129,.35);
  animation: popIn .5s cubic-bezier(.34,1.56,.64,1);
}
@keyframes popIn {
  0%   { transform: scale(0); }
  100% { transform: scale(1); }
}
.success-hero h1 {
  font-size: 26px; font-weight: 800; color: #065f46;
  margin-bottom: 8px;
}
.success-hero p.lead {
  font-size: 15px; color: #047857; line-height: 1.6;
  max-width: 540px; margin: 0 auto;
}

/* ── Application-code card ────────────────────────────── */
.code-card {
  background: #fff;
  border: 3px dashed #6366f1;
  border-radius: 16px;
  padding: 28px 24px;
  text-align: center;
  margin-bottom: 20px;
  position: relative;
}
.code-card::before {
  content: "★";
  position: absolute;
  top: -14px; left: 50%;
  transform: translateX(-50%);
  background: #6366f1; color: white;
  width: 28px; height: 28px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.code-card .label {
  font-size: 12px; font-weight: 800;
  color: #4f46e5; letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.code-card .sub {
  font-size: 12px; color: #6b7280; margin-bottom: 16px;
}
.code-display {
  display: inline-block;
  font-family: 'Courier New', monospace;
  font-size: 42px; font-weight: 900;
  letter-spacing: 8px;
  color: #312e81;
  background: #eef2ff;
  padding: 16px 28px;
  border-radius: 12px;
  border: 2px solid #c7d2fe;
  user-select: all;
  margin-bottom: 18px;
  line-height: 1.2;
  word-break: break-all;
}
@media (max-width: 520px) {
  .code-display { font-size: 28px; letter-spacing: 5px; padding: 14px 18px; }
}
.code-actions {
  display: flex; gap: 10px; justify-content: center;
  flex-wrap: wrap; margin-bottom: 18px;
}
.code-actions button {
  padding: 11px 22px;
  border-radius: 10px;
  font-size: 14px; font-weight: 700;
  cursor: pointer; transition: all .2s;
  border: 2px solid #6366f1;
  background: white; color: #4f46e5;
  display: inline-flex; align-items: center; gap: 8px;
}
.code-actions button:hover {
  background: #6366f1; color: white;
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(99,102,241,.35);
}
.code-actions button.primary {
  background: linear-gradient(135deg, #6366f1, #8b5cf6);
  color: white; border: none;
}
.code-actions button.primary:hover {
  box-shadow: 0 6px 20px rgba(99,102,241,.5);
}
.code-actions button.copied {
  background: #10b981; color: white;
  border-color: #10b981;
}

/* ── Warning / instructions card ──────────────────────── */
.warning-card {
  background: #fffbeb;
  border: 2px solid #f59e0b;
  border-radius: 16px;
  padding: 22px 24px;
  margin-bottom: 20px;
}
.warning-card .warn-head {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px;
  color: #b45309;
}
.warning-card .warn-head i { font-size: 24px; }
.warning-card .warn-head h3 {
  font-size: 16px; font-weight: 800;
  text-transform: uppercase; letter-spacing: 0.5px;
}
.warning-card ul {
  list-style: none; padding: 0; margin: 0;
  display: flex; flex-direction: column; gap: 12px;
}
.warning-card ul li {
  display: flex; gap: 12px;
  font-size: 14px; line-height: 1.6;
  color: #78350f;
  padding-left: 4px;
}
.warning-card ul li .li-icon {
  flex-shrink: 0;
  width: 24px; height: 24px;
  background: #fde68a;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  color: #92400e; font-size: 12px;
  margin-top: 1px;
}
.warning-card ul li strong { color: #7c2d12; font-weight: 700; }

/* ── Danger callout (bottom of warning) ──────────────── */
.danger-note {
  margin-top: 16px;
  background: #fef2f2;
  border: 2px solid #ef4444;
  border-radius: 12px;
  padding: 14px 16px;
  display: flex; align-items: flex-start; gap: 12px;
  color: #991b1b;
}
.danger-note i { font-size: 20px; flex-shrink: 0; margin-top: 1px; }
.danger-note .txt { font-size: 13px; line-height: 1.55; }
.danger-note strong { color: #7f1d1d; }

/* ── Application summary footer ───────────────────────── */
.app-summary {
  background: #f8fafc;
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  padding: 16px 20px;
  margin-bottom: 20px;
  font-size: 13px;
}
.app-summary .row {
  display: flex; justify-content: space-between;
  padding: 4px 0;
  color: #4b5563;
}
.app-summary .row .k { font-weight: 600; color: #6b7280; }
.app-summary .row .v { font-weight: 700; color: #111827; text-align: right; }

/* ── Rating card (kept from before) ───────────────────── */
.rating-card {
  background: #fff;
  border: 1px solid #e5e7eb;
  border-radius: 14px;
  padding: 24px;
  text-align: center;
  margin-bottom: 20px;
}
</style>
</head>
<body style="background:#f8fafc">
<div class="apply-page" id="applyPage">
  <div class="spinner"><i class="fas fa-spinner fa-spin"></i> Loading...</div>
</div>

<script>
// Get job ID from the URL query string (e.g., /apply.html?job=123)
const jobId = parseInt(new URLSearchParams(window.location.search).get('job'), 10);
const BACKEND_URL = 'https://hrhiringpro-hrpro.hf.space';
let job = null;

async function loadJob() {
  try {
    const res = await fetch(`${BACKEND_URL}/api/jobs/${jobId}/public`);
    if (!res.ok) {
      document.getElementById('applyPage').innerHTML =
        '<div class="alert alert-error">Job not found or no longer active.</div>';
      return;
    }
    job = await res.json();
    renderForm();
  } catch (e) {
    document.getElementById('applyPage').innerHTML =
      '<div class="alert alert-error">Error loading job. Please try again.</div>';
  }
}

function renderForm() {
  const deadline = job.deadline ? new Date(job.deadline) : null;
  if (deadline && new Date() > deadline) {
    document.getElementById('applyPage').innerHTML = `
      <div class="apply-header"><h1>${job.title}</h1><p>Application deadline has passed</p></div>
      <div class="alert alert-error">The application deadline for this position was ${deadline.toLocaleDateString()}.</div>`;
    return;
  }

  const sections = job.form_fields?.sections || getDefaultSections();

  document.getElementById('applyPage').innerHTML = `
    <div class="apply-header">
      <div class="ai-badge" style="margin-bottom:12px"><i class="fas fa-briefcase"></i> Job Application</div>
      <h1>${job.title}</h1>
      <p>${job.department} | ${job.location || 'Remote'} | ${job.job_type?.replace('_',' ') || 'Full Time'}</p>
      ${deadline ? `<p style="margin-top:8px;font-size:13px;opacity:0.8"><i class="fas fa-clock"></i> Apply by: ${deadline.toLocaleDateString()}</p>` : ''}
    </div>

    <div class="card" style="margin-bottom:20px">
      <div class="card-header"><h3><i class="fas fa-info-circle"></i> Job Overview</h3></div>
      <div class="card-body">
        <p class="text-sm" style="line-height:1.8">${job.description}</p>
        ${job.requirements ? `<div class="mt-4"><b>Requirements:</b><p class="text-sm mt-2" style="line-height:1.8">${job.requirements}</p></div>` : ''}
        ${job.skills_required?.length ? `<div class="mt-4"><b>Required Skills:</b><div class="tags-wrap mt-2">${job.skills_required.map(s=>`<span class="tag">${s}</span>`).join('')}</div></div>` : ''}
        <div class="grid-2 mt-4 text-sm" style="gap:8px">
          ${job.experience_years ? `<div><i class="fas fa-briefcase text-light"></i> Min Experience: <b>${job.experience_years} years</b></div>` : ''}
        </div>
      </div>
    </div>

    <form id="applicationForm" enctype="multipart/form-data">
      ${sections.map(section => `
        <div class="card" style="margin-bottom:16px">
          <div class="card-header"><h3><i class="fas fa-list"></i> ${section.title}</h3></div>
          <div class="card-body">
            <div class="form-grid-2">
              ${(section.fields || []).map(field => renderField(field)).join('')}
            </div>
          </div>
        </div>`).join('')}

      <!-- CV Upload Field -->
      <div class="card" style="margin-bottom:16px">
        <div class="card-header"><h3><i class="fas fa-file-alt"></i> CV/Resume Upload</h3></div>
        <div class="card-body">
          <div class="form-group form-group-full">
            <label>Upload your CV/Resume *</label>
            <input type="file" name="cv_file" id="cv_file" accept=".pdf,.docx" required>
            <div class="text-xs text-light mt-1">Accepted formats: PDF, DOCX (Max 5MB)</div>
          </div>
        </div>
      </div>

      <div id="submitSection" style="text-align:center;margin-top:20px">
        <div id="appError" class="alert alert-error" style="display:none"></div>
        <div id="appSuccess" style="display:none"></div>
        <button type="submit" class="btn btn-primary" id="submitBtn" style="font-size:16px;padding:14px 50px">
          <span class="btn-text"><i class="fas fa-paper-plane"></i> Submit Application</span>
          <span class="btn-loader" style="display:none"><i class="fas fa-spinner fa-spin"></i> Submitting...</span>
        </button>
        <p class="text-xs text-light mt-4">By submitting, you confirm all information is accurate.</p>
      </div>
    </form>`;

  document.getElementById('applicationForm').addEventListener('submit', submitApp);
}

function getDefaultSections() {
  return [{
    title: 'Application Details',
    fields: [
      {id:'full_name',label:'Full Name',type:'text',required:true,placeholder:'Your full name'},
      {id:'email',label:'Email Address',type:'email',required:true,placeholder:'your@email.com'},
      {id:'phone',label:'Phone Number',type:'phone',required:true,placeholder:'+1234567890'},
      {id:'address',label:'Address',type:'text',required:false,placeholder:'Your address'},
      {id:'experience_years',label:'Years of Experience',type:'number',required:true,placeholder:'2'},
      {id:'cgpa',label:'CGPA/GPA',type:'number',required:false,placeholder:'3.5'},
      {id:'skills',label:'Technical Skills (comma separated)',type:'text',required:false,placeholder:'Python, React, SQL'},
      {id:'cover_letter',label:'Cover Letter',type:'textarea',required:true,placeholder:'Tell us about yourself...'}
    ]
  }];
}

function renderField(field) {
  const req = field.required ? '<span style="color:red">*</span>' : '';
  const isFullWidth = ['textarea','file'].includes(field.type)
    || field.id?.includes('cover')
    || field.id?.includes('address')
    || field.id?.includes('description');

  let input = '';
  if (field.type === 'textarea') {
    input = `<textarea name="${field.id}" id="field_${field.id}" rows="4" placeholder="${field.placeholder||''}" ${field.required?'required':''}></textarea>`;
  } else if (field.type === 'select' && field.options?.length) {
    input = `<select name="${field.id}" id="field_${field.id}" ${field.required?'required':''}>
      <option value="">Select...</option>
      ${field.options.map(o=>`<option value="${o}">${o}</option>`).join('')}
    </select>`;
  } else if (field.type === 'radio' && field.options?.length) {
    input = `<div style="display:flex;flex-direction:column;gap:8px">${field.options.map(o=>`
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="radio" name="${field.id}" value="${o}" ${field.required?'required':''}> ${o}
      </label>`).join('')}</div>`;
  } else if (field.type === 'checkbox' && field.options?.length) {
    input = `<div class="checkbox-group">${field.options.map(o=>`
      <label class="checkbox-item"><input type="checkbox" name="${field.id}[]" value="${o}"> ${o}</label>`).join('')}</div>`;
  } else if (field.type === 'file') {
    input = `<input type="file" name="${field.id}" id="field_${field.id}" accept=".pdf,.doc,.docx">`;
  } else if (field.type === 'number') {
    input = `<input type="number" name="${field.id}" id="field_${field.id}" placeholder="${field.placeholder||''}" ${field.required?'required':''} step="0.1" min="0">`;
  } else if (field.type === 'date') {
    input = `<input type="date" name="${field.id}" id="field_${field.id}" ${field.required?'required':''}>`;
  } else {
    const t = field.type === 'phone' ? 'tel' : field.type === 'email' ? 'email' : 'text';
    input = `<input type="${t}" name="${field.id}" id="field_${field.id}" placeholder="${field.placeholder||''}" ${field.required?'required':''}>`;
  }

  return `<div class="form-group ${isFullWidth ? 'form-group-full' : ''}">
    <label for="field_${field.id}">${field.label} ${req}</label>
    ${input}
  </div>`;
}

async function submitApp(e) {
  e.preventDefault();

  const btn = document.getElementById('submitBtn');
  const fileInput = document.getElementById('cv_file');

  if (!fileInput.files.length) {
    alert('Please upload your CV/Resume');
    return;
  }

  btn.querySelector('.btn-text').style.display = 'none';
  btn.querySelector('.btn-loader').style.display = 'inline';
  btn.disabled = true;

  document.getElementById('appError').style.display = 'none';

  const form = document.getElementById('applicationForm');
  const formData = new FormData(form);

  // Collect regular fields into payload JSON
  const data = {};
  for (const [key, val] of formData.entries()) {
    if (key !== 'cv_file') {
      if (data[key]) {
        if (Array.isArray(data[key])) data[key].push(val);
        else data[key] = [data[key], val];
      } else {
        data[key] = val;
      }
    }
  }

  const payload = {
    ...data,
    full_name: data.full_name || data.name || '',
    email: data.email || '',
    phone: data.phone || '',
    experience_years: parseFloat(data.experience_years) || 0,
    cgpa: parseFloat(data.cgpa) || 0,
    skills: data.skills
      ? (Array.isArray(data.skills) ? data.skills : data.skills.split(',').map(s => s.trim()))
      : [],
    cover_letter: data.cover_letter || ''
  };

  const submitData = new FormData();
  submitData.append('payload', JSON.stringify(payload));
  submitData.append('cv_file', fileInput.files[0]);

  try {
    const res = await fetch(`${BACKEND_URL}/api/apply/${jobId}`, {
      method: 'POST',
      body: submitData
    });
    const result = await res.json();

    if (res.ok) {
      renderSuccessScreen(result, payload);
    } else {
      const errorEl = document.getElementById('appError');
      errorEl.textContent = result.detail || 'Submission failed';
      errorEl.style.display = 'block';
      btn.querySelector('.btn-text').style.display = 'inline';
      btn.querySelector('.btn-loader').style.display = 'none';
      btn.disabled = false;
    }
  } catch (err) {
    const errorEl = document.getElementById('appError');
    errorEl.textContent = 'Network error. Please try again.';
    errorEl.style.display = 'block';
    btn.querySelector('.btn-text').style.display = 'inline';
    btn.querySelector('.btn-loader').style.display = 'none';
    btn.disabled = false;
  }
}

function renderSuccessScreen(result, payload) {
  document.getElementById('applicationForm').style.display = 'none';

  const code = result.application_code || '--------';
  const email = payload.email || '';

  const successEl = document.getElementById('appSuccess');
  successEl.style.display = 'block';
  successEl.innerHTML = `
    <!-- 1. Congratulations hero -->
    <div class="success-hero">
      <div class="success-icon"><i class="fas fa-check"></i></div>
      <h1>Congratulations, ${escapeHtml(payload.full_name || 'Candidate')}!</h1>
      <p class="lead">
        Your application for <strong>${escapeHtml(job.title)}</strong> has been submitted successfully.
        Our team will review it and reach out within <strong>5–7 business days</strong>.
      </p>
    </div>

    <!-- 2. Application code — the star of the page -->
    <div class="code-card">
      <div class="label">Your Unique Application Code</div>
      <div class="sub">Save this code — it's your key to the next step</div>

      <div class="code-display" id="appCode">${escapeHtml(code)}</div>

      <div class="code-actions">
        <button class="primary" id="copyCodeBtn" onclick="copyAppCode()">
          <i class="fas fa-copy"></i> Copy Code
        </button>
        <button onclick="downloadCode()">
          <i class="fas fa-download"></i> Save as File
        </button>
        <button onclick="window.print()">
          <i class="fas fa-print"></i> Print
        </button>
      </div>

      <p style="font-size:12px;color:#6b7280;margin:0">
        <i class="fas fa-envelope"></i>
        This code has also been emailed to <strong>${escapeHtml(email || 'your inbox')}</strong>
      </p>
    </div>

    <!-- 3. Warning + instructions -->
    <div class="warning-card">
      <div class="warn-head">
        <i class="fas fa-exclamation-triangle"></i>
        <h3>Keep This Code Safe — Read Carefully</h3>
      </div>
      <ul>
        <li>
          <span class="li-icon"><i class="fas fa-shield-alt"></i></span>
          <div>
            <strong>Do not share this code with anyone.</strong>
            Treat it like a password — anyone with it can take your assessment on your behalf.
          </div>
        </li>
        <li>
          <span class="li-icon"><i class="fas fa-key"></i></span>
          <div>
            <strong>This code is required to start the assessment</strong> if you are shortlisted.
            You will need it every time you access the assessment link we email you.
          </div>
        </li>
        <li>
          <span class="li-icon"><i class="fas fa-lock"></i></span>
          <div>
            <strong>Each code can be used only once.</strong>
            Once you begin the assessment, your code is permanently locked — you cannot restart or retake it.
          </div>
        </li>
        <li>
          <span class="li-icon"><i class="fas fa-bookmark"></i></span>
          <div>
            <strong>Keep a copy in multiple places</strong> — screenshot it, save the email, or print this page.
            Store it somewhere safe until you hear back from us.
          </div>
        </li>
      </ul>

      <div class="danger-note">
        <i class="fas fa-ban"></i>
        <div class="txt">
          <strong>If you lose this code, you will be disqualified</strong> from taking
          the assessment — and therefore from being considered for this position.
          We cannot issue a replacement code.
        </div>
      </div>
    </div>

    <!-- 4. Application summary -->
    <div class="app-summary">
      <div class="row"><span class="k">Application ID</span><span class="v">#${result.application_id}</span></div>
      <div class="row"><span class="k">Position</span><span class="v">${escapeHtml(job.title)}</span></div>
      <div class="row"><span class="k">Applicant</span><span class="v">${escapeHtml(payload.full_name || '—')}</span></div>
      <div class="row"><span class="k">Email</span><span class="v">${escapeHtml(email || '—')}</span></div>
      <div class="row"><span class="k">Status</span><span class="v" style="color:#d97706">Pending Review</span></div>
    </div>

    <!-- 5. Company rating -->
    <div class="rating-card">
      <h3 style="font-size:16px;font-weight:700;margin-bottom:6px">
        Rate Your Application Experience
      </h3>
      <p style="font-size:13px;color:#6b7280;margin-bottom:16px">
        Your feedback helps us improve the process for future candidates.
      </p>
      <div class="star-rating" style="justify-content:center;margin-bottom:16px" id="companyRating">
        ${[1,2,3,4,5].map(i =>
          `<span class="star" onclick="rateCompany(${result.application_id},${i})"
                 style="font-size:36px;cursor:pointer">★</span>`
        ).join('')}
      </div>
      <textarea id="ratingFeedback" rows="2" placeholder="Share your feedback (optional)..."
        style="width:100%;max-width:460px;padding:10px;border:1px solid #e5e7eb;border-radius:8px;font-family:inherit;font-size:14px;resize:vertical"></textarea>
      <br>
      <button class="btn btn-primary" style="margin-top:12px" onclick="submitRating(${result.application_id})">
        <i class="fas fa-star"></i> Submit Rating
      </button>
    </div>

    <!-- 6. What's next -->
    <div style="text-align:center;padding:16px;color:#6b7280;font-size:13px;line-height:1.8">
      <strong style="color:#374151">What happens next?</strong><br>
      1. Our team reviews your application<br>
      2. If shortlisted, you'll receive an assessment link by email<br>
      3. Use your code above to unlock and take the assessment<br>
      4. We'll be in touch with the final decision
    </div>
  `;

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, m =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

/* ─── Code actions ────────────────────────────────────── */
function copyAppCode() {
  const code = document.getElementById('appCode').textContent.trim();
  if (!code || code === '--------') return;

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(code).then(() => markCopied());
  } else {
    const tmp = document.createElement('textarea');
    tmp.value = code;
    tmp.style.position = 'fixed';
    tmp.style.opacity = '0';
    document.body.appendChild(tmp);
    tmp.select();
    try { document.execCommand('copy'); markCopied(); } catch (e) { /* ignore */ }
    document.body.removeChild(tmp);
  }
}

function markCopied() {
  const btn = document.getElementById('copyCodeBtn');
  const original = btn.innerHTML;
  btn.classList.add('copied');
  btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
  setTimeout(() => {
    btn.classList.remove('copied');
    btn.innerHTML = original;
  }, 2200);
}

function downloadCode() {
  const code = document.getElementById('appCode').textContent.trim();
  const text = [
    '═══════════════════════════════════════════════════',
    '        YOUR APPLICATION CODE — KEEP IT SAFE        ',
    '═══════════════════════════════════════════════════',
    '',
    `  Application Code:  ${code}`,
    `  Position:          ${job.title}`,
    `  Applied on:        ${new Date().toLocaleString()}`,
    '',
    '═══════════════════════════════════════════════════',
    '  IMPORTANT',
    '═══════════════════════════════════════════════════',
    '',
    '  • Do NOT share this code with anyone.',
    '  • You will need this code to take the assessment',
    '    if you are shortlisted.',
    '  • Each code can be used only ONCE.',
    '  • If you lose this code, you will be DISQUALIFIED',
    '    from the assessment and from being considered',
    '    for this position.',
    '',
    '  Keep this file in a safe place.',
    '═══════════════════════════════════════════════════',
  ].join('\n');

  const blob = new Blob([text], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `application-code-${code}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(a.href);
}

/* ─── Rating ──────────────────────────────────────────── */
let selectedRating = 0;
function rateCompany(appId, rating) {
  selectedRating = rating;
  document.querySelectorAll('#companyRating .star').forEach((s, i) => {
    s.classList.toggle('active', i < rating);
    s.style.color = i < rating ? '#f59e0b' : '#d1d5db';
  });
}

async function submitRating(appId) {
  if (!selectedRating) { alert('Please select a rating'); return; }
  try {
    await fetch(`${BACKEND_URL}/api/applications/${appId}/rate-company`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        rating: selectedRating,
        feedback: document.getElementById('ratingFeedback').value
      })
    });
    alert('Thank you for your rating!');
    selectedRating = 0;
    document.querySelectorAll('#companyRating .star').forEach(s => {
      s.classList.remove('active');
      s.style.color = '#d1d5db';
    });
    document.getElementById('ratingFeedback').value = '';
  } catch (e) {
    alert('Error submitting rating');
  }
}

loadJob();
