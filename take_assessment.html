<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assessment - HRPro</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
<style>
.proctor-bar {
  position: sticky; top: 0; z-index: 100;
  background: #1e1b4b; color: #fff; padding: 12px 20px;
  display: flex; justify-content: space-between; align-items: center;
  gap: 20px; flex-wrap: wrap;
}
.warn-counter { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.warn-item {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 14px; background: rgba(255,255,255,.1);
  border-radius: 8px; font-size: 14px; transition: background .3s;
}
.warn-item.warned { background: #dc2626; animation: pulse-warn 1s infinite; }
@keyframes pulse-warn { 0%,100% { opacity:1 } 50% { opacity:.65 } }
.camera-preview {
  position: fixed; bottom: 20px; right: 20px;
  width: 190px; height: 143px; border-radius: 12px;
  border: 3px solid #6366f1; overflow: hidden; z-index: 1000;
  background: #000; box-shadow: 0 10px 30px rgba(0,0,0,.35);
}
.camera-preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.warning-toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%);
  background: #dc2626; color: #fff; padding: 16px 32px; border-radius: 12px;
  font-weight: 700; font-size: 16px; z-index: 2000;
  animation: slideDown .3s ease; box-shadow: 0 10px 30px rgba(220,38,38,.5);
  max-width: 90vw;
}
@keyframes slideDown { from { top:-60px; opacity:0 } to { top:80px; opacity:1 } }
</style>
</head>
<body>

<!-- Proctoring bar with warning counters -->
<div id="proctorBar" class="proctor-bar" style="display:none">
  <div class="warn-counter">
    <div class="warn-item" id="camWarnItem">
      <i class="fas fa-video"></i> Camera: <b><span id="camWarnCount">0</span>/3</b>
    </div>
    <div class="warn-item" id="voiceWarnItem">
      <i class="fas fa-microphone"></i> Voice: <b><span id="voiceWarnCount">0</span>/3</b>
    </div>
  </div>
  <div style="display:flex;gap:20px;align-items:center">
    <div style="font-size:14px"><i class="fas fa-clock"></i> <span id="timer">--:--</span></div>
    <div id="submitStatus" style="font-size:13px;color:#a5b4fc"></div>
  </div>
</div>

<!-- Application-code gate -->
<div id="codeGate" class="apply-page">
  <div class="apply-header">
    <div class="ai-badge" style="margin-bottom:12px"><i class="fas fa-shield-alt"></i> Secure Assessment</div>
    <h1 id="jobTitle">Loading…</h1>
    <p>Enter your application code to begin</p>
  </div>
  <div class="card">
    <div class="card-body">
      <div class="form-group">
        <label>Application Code *</label>
        <input type="text" id="appCodeInput" maxlength="12"
               placeholder="e.g. A3B5K9XZ"
               style="font-size:20px;text-transform:uppercase;letter-spacing:4px;text-align:center;font-weight:700">
        <div class="text-xs text-light mt-2">
          You received this code in your application confirmation email.
        </div>
      </div>
      <div id="codeError" class="alert alert-error" style="display:none"></div>
      <button class="btn btn-primary btn-full" id="verifyBtn" onclick="verifyCode()">
        <i class="fas fa-check"></i> Verify &amp; Start Assessment
      </button>
    </div>
  </div>
</div>

<!-- Assessment -->
<div id="assessmentArea" style="display:none">
  <div class="apply-page">
    <div id="warningsBanner" class="alert alert-warning" style="display:none">
      <b><i class="fas fa-exclamation-triangle"></i> Total warnings: <span id="totalWarnings">0</span>/3</b>
      — The assessment auto-submits once either counter reaches 3.
    </div>

    <div class="card mb-4">
      <div class="card-body">
        <div id="assessmentTitle"></div>
        <div id="assessmentMeta" class="text-sm text-light mt-2"></div>
        <div class="progress-bar mt-4"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      </div>
    </div>

    <div id="questionsContainer"></div>

    <div style="text-align:center;margin:24px 0 80px">
      <button class="btn btn-primary" id="submitBtn" onclick="submitAssessment('manual')"
              style="font-size:16px;padding:14px 50px">
        <i class="fas fa-paper-plane"></i> Submit Assessment
      </button>
    </div>
  </div>
</div>

<!-- Camera preview -->
<div class="camera-preview" id="cameraPreview" style="display:none">
  <video id="camera" autoplay muted playsinline></video>
</div>

<script>
const BACKEND_URL = 'https://hrhiringpro-hrpro.hf.space';
const pathSegments = window.location.pathname.split('/').filter(Boolean);
const assessmentId = parseInt(pathSegments[pathSegments.length - 1], 10);
const prefilledCode = new URLSearchParams(window.location.search).get('code') || '';

let assessment = null;
let verifiedApplication = null;
let answers = {};
let totalQuestions = 0;
let submitted = false;

/* ── Proctoring state ─────────────────────────────────────── */
const MAX_WARNINGS          = 3;
const HEAD_OFFSET_THRESHOLD = 0.34;   // nose off-centre ratio — ignore slight turns
const HEAD_SUSTAIN_MS       = 1800;   // must be sustained this long to warn
const VOICE_SUSTAIN_MS      = 1800;
const WARNING_COOLDOWN_MS   = 5000;   // gap between warnings, so 3s head turn ≠ 3 warnings
const VOICE_ENERGY_MIN      = 95;     // avg 300–3400 Hz energy (0–255)
const VOICE_RMS_MIN         = 0.09;   // loudness (near-mic voice); filters distant/quiet noise

let camWarnings = 0, voiceWarnings = 0;
let headAwayStart = null, voiceStart = null;
let lastCamWarnAt = 0,   lastVoiceWarnAt = 0;
let cameraStream = null, audioContext = null;
let faceDetectInterval = null, voiceDetectInterval = null;

let startTime = null, timeLeftSeconds = 0, timerInterval = null;

if (prefilledCode) document.getElementById('appCodeInput').value = prefilledCode.toUpperCase();

async function loadAssessment() {
  try {
    const res = await fetch(`${BACKEND_URL}/api/assessments/${assessmentId}`);
    if (!res.ok) throw new Error('Assessment not found');
    assessment = await res.json();
    document.getElementById('jobTitle').textContent = assessment.title;
    timeLeftSeconds = assessment.duration_minutes * 60;
  } catch (e) {
    document.getElementById('codeGate').innerHTML =
      '<div class="alert alert-error">Assessment not found or inactive.</div>';
  }
}

async function verifyCode() {
  const code = document.getElementById('appCodeInput').value.trim().toUpperCase();
  if (!code) return showCodeError('Please enter your application code');

  const btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verifying…';

  try {
    const res = await fetch(`${BACKEND_URL}/api/assessments/${assessmentId}/verify-application`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ application_code: code }),
    });
    const data = await res.json();
    if (!res.ok) {
      showCodeError(data.detail || 'Invalid application code');
      btn.disabled = false;
      btn.innerHTML = '<i class="fas fa-check"></i> Verify &amp; Start Assessment';
      return;
    }
    verifiedApplication = data;
    startAssessment();
  } catch (e) {
    showCodeError('Network error. Please try again.');
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check"></i> Verify &amp; Start Assessment';
  }
}

function showCodeError(msg) {
  const el = document.getElementById('codeError');
  el.textContent = msg;
  el.style.display = 'block';
}

async function startAssessment() {
  document.getElementById('codeGate').style.display = 'none';
  document.getElementById('assessmentArea').style.display = 'block';
  document.getElementById('proctorBar').style.display = 'flex';
  document.getElementById('cameraPreview').style.display = 'block';

  renderQuestions();
  startTimer();
  startTime = Date.now();

  if (assessment.anti_cheat) {
    await startProctoring();
  }
}

function renderQuestions() {
  const qs = assessment.questions || [];
  totalQuestions = qs.length;
  document.getElementById('assessmentTitle').innerHTML =
    `<h2 style="font-size:20px">${escapeHtml(assessment.title)}</h2>`;
  document.getElementById('assessmentMeta').innerHTML =
    `<i class="fas fa-list"></i> ${totalQuestions} questions &nbsp;|&nbsp;
     <i class="fas fa-star"></i> ${assessment.total_marks} marks &nbsp;|&nbsp;
     <i class="fas fa-clock"></i> ${assessment.duration_minutes} minutes`;

  document.getElementById('questionsContainer').innerHTML = qs.map((q, idx) => {
    let answerHtml = '';
    if (q.type === 'mcq') {
      answerHtml = (q.options || []).map((opt, i) => `
        <label class="option-item" id="opt_${q.id}_${i}">
          <input type="radio" name="q_${q.id}" value="${i}"
                 onchange="selectOption(${q.id}, ${i})">
          <span>${escapeHtml(opt)}</span>
        </label>`).join('');
    } else if (q.type === 'fill_blank') {
      answerHtml = `<input type="text" placeholder="Your answer…"
        oninput="saveAnswer(${q.id}, this.value)"
        style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px">`;
    } else {
      answerHtml = `<textarea rows="6" placeholder="Write your answer…"
        oninput="saveAnswer(${q.id}, this.value)"
        style="width:100%;padding:10px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit"></textarea>`;
    }
    return `
      <div class="question-card" id="qcard_${q.id}">
        <div class="question-num">
          Question ${idx + 1} of ${totalQuestions}
          <span class="level-${q.level}">${q.level}</span>
          <span style="margin-left:auto;color:var(--text-light)">${q.marks} marks</span>
        </div>
        <div class="question-text">${escapeHtml(q.question)}</div>
        <div>${answerHtml}</div>
      </div>`;
  }).join('');
}

function selectOption(qid, optIdx) {
  document.querySelectorAll(`[id^="opt_${qid}_"]`).forEach(el => el.classList.remove('selected'));
  document.getElementById(`opt_${qid}_${optIdx}`).classList.add('selected');
  saveAnswer(qid, optIdx);
}

function saveAnswer(qid, value) {
  answers[qid] = value;
  document.getElementById(`qcard_${qid}`).classList.add('answered');
  const done = Object.keys(answers).length;
  document.getElementById('progressFill').style.width =
    `${totalQuestions ? (done / totalQuestions) * 100 : 0}%`;
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, m =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

/* ── Timer ─────────────────────────────────────────────────── */
function startTimer() {
  timerInterval = setInterval(() => {
    if (submitted) return;
    timeLeftSeconds--;
    const m = Math.max(0, Math.floor(timeLeftSeconds / 60));
    const s = Math.max(0, timeLeftSeconds % 60);
    document.getElementById('timer').textContent = `${m}:${String(s).padStart(2, '0')}`;
    if (timeLeftSeconds <= 0) submitAssessment('auto', 'Time expired');
  }, 1000);
}

/* ── Proctoring ────────────────────────────────────────────── */
async function startProctoring() {
  try {
    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { width: 320, height: 240, facingMode: 'user' }, audio: false,
    });
    const video = document.getElementById('camera');
    video.srcObject = cameraStream;
    await new Promise(r => (video.onloadedmetadata = r));

    const modelPath = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
    await faceapi.nets.tinyFaceDetector.loadFromUri(modelPath);
    await faceapi.nets.faceLandmark68TinyNet.loadFromUri(modelPath);

    faceDetectInterval = setInterval(checkFace, 600);
    await startVoiceDetection();
  } catch (e) {
    console.error('Proctoring setup failed:', e);
    // Warning counters simply won't fire; candidate can still finish manually.
  }
}

async function checkFace() {
  if (submitted) return;
  try {
    const det = await faceapi
      .detectSingleFace(document.getElementById('camera'),
        new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 }))
      .withFaceLandmarks(true);

    const now = Date.now();

    if (!det) {
      if (headAwayStart === null) headAwayStart = now;
      if (now - headAwayStart > HEAD_SUSTAIN_MS && now - lastCamWarnAt > WARNING_COOLDOWN_MS) {
        issueCamWarning('Face not detected');
        headAwayStart = null;
      }
      return;
    }

    const p = det.landmarks.positions;
    const noseTip   = p[30];
    const leftFace  = p[16];
    const rightFace = p[0];
    const centerX   = (leftFace.x + rightFace.x) / 2;
    const halfW     = Math.abs(leftFace.x - rightFace.x) / 2;
    const offset    = halfW > 5 ? (noseTip.x - centerX) / halfW : 0;

    if (Math.abs(offset) > HEAD_OFFSET_THRESHOLD) {
      if (headAwayStart === null) headAwayStart = now;
      if (now - headAwayStart > HEAD_SUSTAIN_MS && now - lastCamWarnAt > WARNING_COOLDOWN_MS) {
        issueCamWarning('Head turned away');
        headAwayStart = null;
      }
    } else {
      headAwayStart = null;   // slight glance → completely resets, no warning
    }
  } catch (_) { /* ignore transient detection errors */ }
}

async function startVoiceDetection() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const src = audioContext.createMediaStreamSource(stream);
    const analyser = audioContext.createAnalyser();
    analyser.fftSize = 2048;
    src.connect(analyser);

    const freqData = new Uint8Array(analyser.frequencyBinCount);
    const timeData = new Uint8Array(analyser.fftSize);
    const binHz       = audioContext.sampleRate / analyser.fftSize;
    const voiceStart  = Math.floor(300 / binHz);
    const voiceEnd    = Math.ceil(3400 / binHz);

    voiceDetectInterval = setInterval(() => {
      if (submitted) return;
      analyser.getByteFrequencyData(freqData);
      analyser.getByteTimeDomainData(timeData);

      let energy = 0;
      for (let i = voiceStart; i < voiceEnd; i++) energy += freqData[i];
      energy /= (voiceEnd - voiceStart);

      let rms = 0;
      for (let i = 0; i < timeData.length; i++) {
        const v = (timeData[i] - 128) / 128;
        rms += v * v;
      }
      rms = Math.sqrt(rms / timeData.length);

      // Human speech band + near-field loudness — filters birds, traffic, distant chatter.
      const voiceNear = energy > VOICE_ENERGY_MIN && rms > VOICE_RMS_MIN;
      const now = Date.now();

      if (voiceNear) {
        if (voiceStart === null) voiceStart = now;
        if (now - voiceStart > VOICE_SUSTAIN_MS && now - lastVoiceWarnAt > WARNING_COOLDOWN_MS) {
          issueVoiceWarning('Loud voice near you');
          voiceStart = null;
        }
      } else {
        voiceStart = null;
      }
    }, 300);
  } catch (e) {
    console.error('Voice detection setup failed:', e);
  }
}

function issueCamWarning(reason) {
  camWarnings++;
  lastCamWarnAt = Date.now();
  updateWarnUI();
  showWarningToast(`⚠️ Camera Warning ${camWarnings}/${MAX_WARNINGS}: ${reason}`);
  if (camWarnings >= MAX_WARNINGS) submitAssessment('auto', `Excessive camera warnings (${reason})`);
}

function issueVoiceWarning(reason) {
  voiceWarnings++;
  lastVoiceWarnAt = Date.now();
  updateWarnUI();
  showWarningToast(`⚠️ Voice Warning ${voiceWarnings}/${MAX_WARNINGS}: ${reason}`);
  if (voiceWarnings >= MAX_WARNINGS) submitAssessment('auto', `Excessive voice warnings (${reason})`);
}

function updateWarnUI() {
  document.getElementById('camWarnCount').textContent   = camWarnings;
  document.getElementById('voiceWarnCount').textContent = voiceWarnings;
  document.getElementById('totalWarnings').textContent  = camWarnings + voiceWarnings;
  document.getElementById('warningsBanner').style.display = 'block';
  if (camWarnings   > 0) document.getElementById('camWarnItem').classList.add('warned');
  if (voiceWarnings > 0) document.getElementById('voiceWarnItem').classList.add('warned');
}

function showWarningToast(msg) {
  const t = document.createElement('div');
  t.className = 'warning-toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4000);
}

/* ── Submit ────────────────────────────────────────────────── */
async function submitAssessment(type = 'manual', reason = null) {
  if (submitted) return;
  submitted = true;

  clearInterval(timerInterval);
  clearInterval(faceDetectInterval);
  clearInterval(voiceDetectInterval);
  if (cameraStream) cameraStream.getTracks().forEach(t => t.stop());
  if (audioContext) audioContext.close();

  const btn = document.getElementById('submitBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Submitting…'; }
  document.getElementById('submitStatus').textContent = 'Submitting…';

  const minutes = (Date.now() - startTime) / 60000;

  try {
    const res = await fetch(`${BACKEND_URL}/api/assessments/${assessmentId}/submit`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        applicant_name:    verifiedApplication?.applicant_name || '',
        applicant_email:   verifiedApplication?.applicant_email || '',
        application_id:    verifiedApplication?.application_id || null,
        answers,
        time_taken_minutes: minutes,
        submission_type:   type,
        submission_reason: reason,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Submission failed');

    document.getElementById('assessmentArea').innerHTML = `
      <div class="apply-page">
        <div class="card" style="text-align:center;padding:48px">
          <div style="font-size:64px;margin-bottom:16px">🎉</div>
          <h2 style="font-size:24px;margin-bottom:8px">Assessment Submitted</h2>
          <p class="text-light">${type === 'auto'
            ? `Auto-submitted: ${escapeHtml(reason || '')}`
            : 'Thank you for completing the assessment.'}</p>
          <div style="margin-top:24px;padding:20px;background:#f8fafc;border-radius:12px;display:inline-block">
            <div style="font-size:36px;font-weight:800;color:var(--primary)">${data.percentage}%</div>
            <div class="text-light">Grade ${data.grade} — ${data.score}/${data.total}</div>
          </div>
          <p class="text-sm text-light mt-4">
            A confirmation and marksheet have been sent to your email.
          </p>
        </div>
      </div>`;
  } catch (e) {
    document.getElementById('submitStatus').textContent = 'Submit failed';
    showWarningToast('Submission failed: ' + e.message);
  }
}

loadAssessment();
</script>
</body>
</html>
