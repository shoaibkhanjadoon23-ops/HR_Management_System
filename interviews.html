<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interviews - HRPro</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  .plagiarism-alert {
    background: #fef2f2; border: 1px solid #fecaca; color: #dc2626;
    border-radius: 8px; padding: 10px 14px; font-size: 13px;
    margin-top: 8px; display: flex; gap: 10px; align-items: flex-start;
  }
  .plagiarism-alert i { font-size: 16px; margin-top: 1px; }
  .qa-box {
    background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  .qa-box .q-text { font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .qa-box .a-text { font-size: 14px; color: var(--text); background: white; padding: 12px; border-radius: 8px; border: 1px solid var(--border); white-space: pre-wrap; }
  .qa-box .score-badge { float: right; background: var(--primary); color: white; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
</style>
</head>
<body>
<div class="sidebar" id="sidebar">
  <div class="sidebar-logo"><div class="logo-icon"><i class="fas fa-users-cog"></i></div><h2>HR<span>Pro</span></h2></div>
  <nav class="sidebar-nav">
    <div class="nav-section"><div class="nav-section-title">Main</div><a href="/dashboard.html" class="nav-item"><i class="fas fa-home"></i> Dashboard</a><a href="/jobs.html" class="nav-item"><i class="fas fa-briefcase"></i> Job Postings</a><a href="/applications.html" class="nav-item"><i class="fas fa-file-alt"></i> Applications</a></div>
    <div class="nav-section"><div class="nav-section-title">Recruitment</div><a href="/assessments.html" class="nav-item"><i class="fas fa-clipboard-check"></i> Assessments</a><a href="/interviews.html" class="nav-item active"><i class="fas fa-video"></i> Interviews</a></div>
    <div class="nav-section"><div class="nav-section-title">HR</div><a href="/employees.html" class="nav-item"><i class="fas fa-users"></i> Employees</a><a href="/payroll.html" class="nav-item"><i class="fas fa-dollar-sign"></i> Payroll</a></div>
    <div class="nav-section"><div class="nav-section-title">Account</div><a href="#" class="nav-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a></div>
  </nav>
  <div class="sidebar-user" id="sidebarUser"></div>
</div>

<div class="main-content">
<header class="header">
  <div style="display:flex;align-items:center;gap:12px"><button class="sidebar-toggle" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button><div class="header-title"><h2 id="pageTitle">HRPro</h2><p id="pageSubtitle">Human Resource Management System</p></div></div>
  <div class="header-actions"><button class="header-btn" title="Notifications"><i class="fas fa-bell"></i></button><button class="header-btn" title="Profile" onclick="navigate('/dashboard.html')"><i class="fas fa-user-circle"></i></button></div>
</header>

<div class="page-content">
  <div class="page-header">
    <div><h1>Interviews</h1><p>Manage scheduled, completed, and AI interviews</p></div>
    <button class="btn btn-primary" onclick="openScheduleModal()"><i class="fas fa-plus"></i> Schedule Custom Interview</button>
  </div>

  <div class="tabs" id="interviewTabs">
    <button class="tab active" data-tab="upcomingTab">Upcoming</button>
    <button class="tab" data-tab="completedTab">Completed / History</button>
    <button class="tab" data-tab="allTab">All</button>
  </div>

  <div id="upcomingTab" class="tab-content active"><div class="spinner"><i class="fas fa-spinner fa-spin"></i></div></div>
  <div id="completedTab" class="tab-content"></div>
  <div id="allTab" class="tab-content"></div>
</div>
</div>

<!-- Schedule Custom Interview Modal -->
<div id="scheduleModal" class="modal-overlay" style="display:none">
  <div class="modal">
    <div class="modal-header"><h3><i class="fas fa-calendar"></i> Schedule Custom Interview</h3><button class="modal-close" onclick="closeModal('scheduleModal')"><i class="fas fa-times"></i></button></div>
    <div class="modal-body">
      <div class="form-group"><label>Candidate *</label><select id="sCandidate"></select></div>
      <div class="form-group"><label>Date & Time *</label><input type="datetime-local" id="sDate"></div>
      <div class="form-group"><label>Interview Type</label><select id="sType"><option value="online">Online (Video Call)</option><option value="office">Office (In-Person)</option></select></div>
      <div class="form-group"><label>Duration (mins)</label><input type="number" id="sDuration" value="60"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('scheduleModal')">Cancel</button>
      <button class="btn btn-primary" onclick="scheduleCustom()">Schedule & Email</button>
    </div>
  </div>
</div>

<!-- AI Answer Sheet / Marksheet Modal -->
<div id="marksheetModal" class="modal-overlay" style="display:none">
  <div class="modal modal-xl">
    <div class="modal-header">
      <h3 id="msTitle"><i class="fas fa-file-invoice"></i> AI Interview Marksheet</h3>
      <button class="modal-close" onclick="closeModal('marksheetModal')"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body" style="max-height:75vh;overflow-y:auto">
      <div id="msSummary" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-bottom:24px"></div>
      <div id="msTranscript"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('marksheetModal')">Close</button>
      <button class="btn btn-primary" id="downloadPdfBtn"><i class="fas fa-file-pdf"></i> Download PDF</button>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
<script>
requireAuth(); renderSidebarUser(); setActiveNav(); initTabs('interviewTabs');

let interviews = [];
let apps = [];

async function loadData() {
    try {
        [interviews, apps] = await Promise.all([API.get('/api/interviews'), API.get('/api/applications')]);
        
        // Populate candidate select
        const sel = document.getElementById('sCandidate');
        sel.innerHTML = '<option value="">Select candidate...</option>' + apps.map(a => `<option value="${a.id}">${a.applicant_name} - ${a.job_title}</option>`).join('');
        
        renderAll();
    } catch(e) { showToast('Error loading data: ' + e.message, 'error'); }
}

function renderAll() {
    const now = new Date();
    const upcoming = interviews.filter(i => i.status === 'scheduled' && i.scheduled_date && new Date(i.scheduled_date) >= now);
    const completed = interviews.filter(i => i.status === 'completed' || i.status === 'auto_submitted' || i.status === 'interview_passed' || i.status === 'interview_scheduled');
    
    document.getElementById('upcomingTab').innerHTML = renderList(upcoming);
    document.getElementById('completedTab').innerHTML = renderList(completed);
    document.getElementById('allTab').innerHTML = renderList(interviews);
}

function renderList(list) {
    if (!list.length) return '<div class="empty-state"><i class="fas fa-calendar"></i><h3>No interviews found</h3></div>';
    
    return list.map(i => {
        const isAi = i.type === 'ai';
        const d = i.scheduled_date ? new Date(i.scheduled_date) : null;
        
        return `
        <div class="card mb-4">
            <div class="card-body flex justify-between items-center" style="flex-wrap:wrap;gap:12px">
                <div>
                    <div class="font-bold" style="font-size:16px">${escapeHtml(i.applicant_name)}</div>
                    <div class="text-sm text-light">${escapeHtml(i.job_title)}</div>
                    <div class="mt-2 flex gap-2" style="flex-wrap:wrap">
                        <span class="badge ${isAi ? 'badge-interview' : 'badge-shortlisted'}">${isAi ? '🤖 AI Video' : '💼 Custom'}</span>
                        <span class="badge ${i.status === 'completed' ? 'badge-active' : i.status === 'auto_submitted' ? 'badge-rejected' : 'badge-pending'}">${i.status.replace('_', ' ').toUpperCase()}</span>
                        ${d ? `<span class="text-xs text-light"><i class="fas fa-clock"></i> ${d.toLocaleString()}</span>` : ''}
                    </div>
                </div>
                <div class="flex gap-2">
                    ${isAi && (i.status === 'completed' || i.status === 'auto_submitted') ? `
                        <button class="btn btn-sm btn-primary" onclick="viewMarksheet(${i.id})"><i class="fas fa-list"></i> View Marksheet</button>
                    ` : ''}
                    <button class="btn btn-sm btn-danger" onclick="deleteInt(${i.id}, '${i.type}')"><i class="fas fa-trash"></i></button>
                </div>
            </div>
        </div>`;
    }).join('');
}

function openScheduleModal() {
    const tomorrow = new Date(Date.now() + 86400000);
    tomorrow.setMinutes(tomorrow.getMinutes() - tomorrow.getTimezoneOffset());
    document.getElementById('sDate').value = tomorrow.toISOString().slice(0,16);
    openModal('scheduleModal');
}

async function scheduleCustom() {
    const appId = document.getElementById('sCandidate').value;
    const date = document.getElementById('sDate').value;
    if (!appId || !date) { showToast('Select candidate and date', 'warning'); return; }
    
    try {
        await API.post('/api/interviews', {
            application_id: parseInt(appId),
            scheduled_date: date,
            interview_type: document.getElementById('sType').value,
            duration_minutes: parseInt(document.getElementById('sDuration').value) || 60
        });
        showToast('Custom interview scheduled!', 'success');
        closeModal('scheduleModal');
        loadData();
    } catch(e) { showToast('Error: ' + e.message, 'error'); }
}

// --- View Marksheet Logic ---
async function viewMarksheet(id) {
    openModal('marksheetModal');
    document.getElementById('msSummary').innerHTML = '<div class="spinner"><i class="fas fa-spinner fa-spin"></i></div>';
    document.getElementById('msTranscript').innerHTML = '';
    document.getElementById('downloadPdfBtn').onclick = () => API.download(`/api/ai-interviews/${id}/pdf`, `interview_${id}.pdf`);

    try {
        const data = await API.get(`/api/ai-interviews/${id}/details`);
        
        document.getElementById('msTitle').innerHTML = `<i class="fas fa-file-invoice"></i> Marksheet: ${escapeHtml(data.candidate_name)}`;
        
        // Render Summary
        document.getElementById('msSummary').innerHTML = `
            <div style="background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">
                <div style="font-size:12px;color:var(--text-light);text-transform:uppercase;font-weight:700">Total Score</div>
                <div style="font-size:28px;font-weight:800;color:var(--primary);margin-top:8px">${data.total_score} / ${data.total_possible}</div>
            </div>
            <div style="background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">
                <div style="font-size:12px;color:var(--text-light);text-transform:uppercase;font-weight:700">Percentage</div>
                <div style="font-size:28px;font-weight:800;color:${data.percentage >= 50 ? 'var(--success)' : 'var(--danger)'};margin-top:8px">${data.percentage}%</div>
            </div>
            <div style="background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center">
                <div style="font-size:12px;color:var(--text-light);text-transform:uppercase;font-weight:700">Grade</div>
                <div style="font-size:28px;font-weight:800;color:var(--primary);margin-top:8px">${data.grade}</div>
            </div>
        `;

        // Render Transcript
        if (!data.transcript || data.transcript.length === 0) {
            document.getElementById('msTranscript').innerHTML = '<p class="text-light text-center">No answers recorded.</p>';
            return;
        }

        document.getElementById('msTranscript').innerHTML = data.transcript.map((item, idx) => {
            const isPlagiarized = item.plagiarism_flag;
            return `
            <div class="qa-box">
                <div class="score-badge">${item.score} / 10</div>
                <div class="q-text">Q${idx + 1}: ${escapeHtml(item.question)}</div>
                <div class="a-text">${escapeHtml(item.answer || 'No answer provided.')}</div>
                ${isPlagiarized ? `
                    <div class="plagiarism-alert">
                        <i class="fas fa-exclamation-triangle"></i>
                        <div><b>Plagiarism Flag:</b> ${escapeHtml(item.plagiarism_flag)}</div>
                    </div>
                ` : ''}
            </div>`;
        }).join('');

    } catch(e) {
        document.getElementById('msSummary').innerHTML = `<div class="alert alert-error">Error loading marksheet: ${e.message}</div>`;
    }
}

async function deleteInt(id, type) {
    if (!confirm('Delete this interview record? This action cannot be undone.')) return;
    try {
        await API.delete(`/api/interviews/${id}?type=${type}`);
        showToast('Interview deleted', 'success');
        loadData();
    } catch(e) { showToast('Error: ' + e.message, 'error'); }
}

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, m =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

loadData();
</script>
</body>
</html>
